<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FedGuard-IoT | Security Command Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-info" href="/">
                <i class="bi bi-shield-lock-fill me-2"></i>FedGuard-IoT
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/inference"><i class="bi bi-radar me-1"></i> Live Inference</a></li>
                    <li class="nav-item"><a class="nav-link" href="/orchestrator"><i class="bi bi-cpu me-1"></i> FL Orchestrator</a></li>
                </ul>
                <span class="badge bg-success bg-opacity-25 text-success border border-success d-flex align-items-center px-3 py-2">
                    <span class="spinner-grow spinner-grow-sm me-2 text-success" role="status" aria-hidden="true" style="width: 0.5rem; height: 0.5rem;"></span>
                    System Secure
                </span>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        {% block content %}{% endblock %}
    </div>

    <script>
        Chart.defaults.color = '#9ca3af';
        Chart.defaults.scale.grid.color = '#1f2937';
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
