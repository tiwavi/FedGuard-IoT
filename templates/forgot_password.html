{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-4">
        <div class="card card-custom p-4">
            <h3 class="text-white text-center mb-4"><i class="bi bi-key-fill text-warning"></i> Reset Password</h3>
            <p class="text-muted small text-center mb-4">Enter your registered network username to assign a new password to your identity.</p>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-muted">Username</label>
                    <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted">New Password</label>
                    <input type="password" name="new_password" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold">Reset Password</button>
            </form>
            
            <div class="text-center mt-4">
                <a href="/login" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Return to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
