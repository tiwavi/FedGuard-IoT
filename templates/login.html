{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-4">
        <div class="card card-custom p-4">
            <h3 class="text-white text-center mb-4"><i class="bi bi-shield-lock text-info"></i> Secure Login</h3>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-muted">Username</label>
                    <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <label class="form-label text-muted mb-0">Password</label>
                        <a href="/forgot-password" class="small text-info text-decoration-none">Forgot Password?</a>
                    </div>
                    <input type="password" name="password" class="form-control bg-dark text-white border-secondary mt-2" required>
                </div>
                <button type="submit" class="btn btn-info w-100 fw-bold">Authenticate</button>
            </form>
            
            <hr class="border-secondary my-4">
            <div class="text-center">
                <p class="text-muted small mb-2">Don't have a node identity?</p>
                <a href="/signup" class="small text-info text-decoration-none fw-bold">Request Access (Sign Up)</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
